name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Directory Structure & Build APK
        run: |
          mkdir temp_flutter
          cd temp_flutter
          flutter create islam_tube
          cd islam_tube
          
          # Copy source files to correct lib folder
          cp -f ../../main.dart lib/ 2>/dev/null || true
          cp -f ../../home_screen.dart lib/ 2>/dev/null || true
          
          # Build Release APK
          flutter build apk --release
          
          # Move APK out for GitHub release
          mkdir -p ../../output
          cp build/app/outputs/flutter-apk/app-release.apk ../../output/IslamTube.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslamTube-APK
          path: output/IslamTube.apk
          
