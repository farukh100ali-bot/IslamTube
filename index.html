<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IslamTube</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { background: #0f0f0f; font-family: 'Roboto', sans-serif; }
 .no-scrollbar::-webkit-scrollbar { display: none; }
 .active-btn { background: #22c55e!important; color: black!important; }
</style>
</head>
<body class="text-white pb-20">

<!-- Top Header -->
<header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur flex items-center justify-between px-4 py-2">
  <div class="flex items-center gap-2">
    <i class="fa-brands fa-youtube text-red-600 text-2xl"></i>
    <span class="font-bold text-xl">Islam<span class="text-green-500">tube</span></span>
  </div>
  <div class="flex items-center gap-5 text-xl">
    <i class="fa-regular fa-bell cursor-pointer hover:text-green-500"></i>
    <i class="fa-solid fa-magnifying-glass cursor-pointer hover:text-green-500"></i>
  </div>
</header>

<!-- Category Buttons -->
<div class="sticky top-[52px] z-40 bg-[#0f0f0f] px-3 py-2 flex gap-2 overflow-x-auto no-scrollbar border-b border-[#272727]">
  <button class="bg-[#272727] px-3 py-1.5 rounded-lg text-sm whitespace-nowrap hover:bg-gray-700"><i class="fa-solid fa-compass text-green-500"></i></button>
  <button class="active-btn px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap">All</button>
  <button class="bg-[#272727] px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap hover:bg-gray-700">Quran</button>
  <button class="bg-[#272727] px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap hover:bg-gray-700">Hadees</button>
  <button class="bg-[#272727] px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap hover:bg-gray-700">Bayaan</button>
  <button class="bg-[#272727] px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap hover:bg-gray-700">Nasheed</button>
</div>

<!-- Banner -->
<div class="relative">
  <img src="https://images.unsplash.com/photo-1589652717521-10c0d092dea9?q=80&w=1200" class="w-full h-48 object-cover">
  <div class="absolute inset-0 bg-gradient-to-t from-black to-transparent"></div>
  <div class="absolute bottom-3 left-3 right-3 text-center">
    <h2 class="text-lg font-bold" dir="rtl">اللہ کا ذکر دل کے سکون کی کنجی ہے</h2>
    <p class="bg-green-700 text-xs px-2 py-1 rounded mt-1" dir="rtl">اللہ کو یاد کرنے سے دل کو سکون ملتا ہے</p>
  </div>
  <span class="absolute top-2 right-2 bg-red-600 text-xs px-2 py-1 rounded flex items-center gap-1"><i class="fa-solid fa-circle-dot animate-pulse"></i> LIVE</span>
</div>
