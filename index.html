<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>IslamTube</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --bg:#0f0f0f;
    --card:#181818;
    --line:#292929;

    --text:#f5f5f5;
    --muted:#aaa;

    /* Light green IslamTube */
    --green:#45a94e;
}

html,
body{

    background:var(--bg);
    color:var(--text);

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    min-height:100%;

    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   TOP HEADER
========================= */

.top{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:62px;

    background:#0f0f0f;

    border-bottom:
    1px solid var(--line);

    z-index:1000;

    display:flex;

    align-items:center;

    padding:0 12px;

    gap:12px;
}


/* HOME ICON */

.topHome{

    width:40px;
    height:40px;

    border:0;

    background:transparent;

    color:white;

    font-size:25px;

    border-radius:50%;
}


/* LOGO */

.brand{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:23px;

    font-weight:700;

    white-space:nowrap;
}


.logo{

    width:42px;
    height:30px;

    border-radius:8px;

    background:
    var(--green);

    display:grid;

    place-items:center;
}


.logo:after{

    content:"";

    border-left:
    11px solid white;

    border-top:
    7px solid transparent;

    border-bottom:
    7px solid transparent;

    margin-left:3px;
}


/* HEADER BUTTONS */

.topActions{

    margin-left:auto;

    display:flex;

    gap:2px;
}

.ico{

    border:0;

    background:transparent;

    color:white;

    width:42px;
    height:42px;

    border-radius:50%;

    font-size:23px;
}

.ico:active{

    background:#2b2b2b;
}


/* =========================
   SEARCH
========================= */

.searchPanel{

    position:fixed;

    top:62px;

    left:0;
    right:0;

    background:#0f0f0f;

    padding:9px 12px;

    border-bottom:
    1px solid var(--line);

    z-index:999;

    display:none;

    gap:8px;
}

.searchPanel.open{

    display:flex;
}

.searchPanel input{

    flex:1;

    background:#242424;

    border:
    1px solid #444;

    color:white;

    border-radius:24px;

    height:44px;

    padding:0 16px;

    outline:none;

    font-size:16px;
}


/* =========================
   CATEGORY BAR
========================= */

.categories{

    position:fixed;

    top:62px;

    left:0;
    right:0;

    height:58px;

    background:#0f0f0f;

    display:flex;

    gap:9px;

    align-items:center;

    padding:0 10px;

    overflow:auto;

    z-index:900;
}

.categories::-webkit-scrollbar{
    display:none;
}


.chip{

    border:0;

    background:#303030;

    color:#eee;

    padding:
    9px 16px;

    border-radius:9px;

    white-space:nowrap;
}

.chip.active{

    background:white;

    color:#111;
}


/* =========================
   MAIN
========================= */

main{

    padding:
    120px 0 82px;

    max-width:900px;

    margin:auto;
}


/* =========================
   VIDEO CARD
========================= */

.video{

    margin-bottom:18px;
}


.thumb{

    position:relative;

    width:100%;

    aspect-ratio:16/9;

    background:#292929;

    overflow:hidden;
}


.thumb img{

    width:100%;

    height:100%;

    object-fit:cover;
}


.duration{

    position:absolute;

    right:8px;

    bottom:7px;

    background:#000d;

    padding:4px 6px;

    border-radius:4px;

    font-size:12px;
}


.info{

    display:flex;

    gap:11px;

    padding:11px 12px;
}


.avatar{

    flex:
    0 0 42px;

    width:42px;

    height:42px;

    border-radius:50%;

    background:
    var(--green);

    display:grid;

    place-items:center;

    font-weight:bold;
}


.details{

    min-width:0;

    flex:1;
}


.title{

    font-weight:600;

    font-size:17px;

    line-height:1.35;
}


.meta{

    color:var(--muted);

    font-size:14px;

    margin-top:6px;

    line-height:1.4;
}


.more{

    color:#bbb;

    font-size:24px;

    width:22px;

    border:0;

    background:none;
}


/* =========================
   POSTS
========================= */

.post{

    padding:14px 13px;

    border-top:
    1px solid var(--line);

    border-bottom:
    1px solid var(--line);

    margin-bottom:14px;
}


.postHead{

    display:flex;

    align-items:center;

    gap:10px;
}


.postText{

    margin-top:10px;

    line-height:1.5;
}


.postBtns{

    display:flex;

    gap:25px;

    margin-top:13px;

    color:#bbb;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom{

    position:fixed;

    bottom:0;

    left:0;
    right:0;

    height:70px;

    background:#0f0f0f;

    border-top:
    1px solid #333;

    display:flex;

    z-index:2000;
}


.nav{

    flex:1;

    border:0;

    background:none;

    color:#aaa;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:11px;
}


.nav .nicon{

    font-size:23px;

    line-height:25px;
}


.nav.active{

    color:white;
}


.nav.active .nicon{

    color:
    var(--green);
}


/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    color:#888;

    padding:22px;
}


.spinner{

    width:24px;

    height:24px;

    border:
    3px solid #444;

    border-top-color:
    var(--green);

    border-radius:50%;

    margin:auto;

    animation:
    spin 1s linear infinite;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   EMPTY
========================= */

.empty{

    padding:50px 20px;

    text-align:center;

    color:#999;
}


/* =========================
   ROWS
========================= */

.row{

    display:flex;

    gap:12px;

    padding:13px;

    border-bottom:
    1px solid var(--line);

    align-items:center;
}


.row img{

    width:130px;

    height:74px;

    object-fit:cover;

    border-radius:7px;
}


.rowText{

    flex:1;
}


.small{

    font-size:13px;

    color:#999;

    margin-top:5px;
}


/* =========================
   SETTINGS
========================= */

.pageTitle{

    font-size:22px;

    font-weight:700;

    padding:15px 13px;
}


.setting{

    display:flex;

    justify-content:
    space-between;

    align-items:center;

    padding:17px 14px;

    border-bottom:
    1px solid var(--line);
}


.setting button{

    background:#303030;

    color:white;

    border:0;

    border-radius:8px;

    padding:8px 12px;
}


/* =========================
   MODAL / VIDEO PAGE
========================= */

.modal{

    position:fixed;

    inset:0;

    background:#000;

    z-index:4000;

    display:none;

    overflow:auto;
}


.modal.open{

    display:block;
}


.modalTop{

    height:58px;

    display:flex;

    align-items:center;

    padding:0 12px;

    border-bottom:
    1px solid #222;
}


.back{

    border:0;

    background:none;

    color:white;

    font-size:27px;

    width:45px;
}


.player{

    width:100%;

    aspect-ratio:16/9;

    background:#000;
}


.player video{

    width:100%;

    height:100%;

    object-fit:contain;
}


.videoPage{

    padding-bottom:40px;
}


.videoPage h1{

    font-size:20px;

    line-height:1.35;

    padding:14px;
}


.actions{

    display:flex;

    gap:7px;

    overflow:auto;

    padding:
    0 12px 12px;
}


.action{

    background:#292929;

    border:0;

    color:#eee;

    border-radius:18px;

    padding:
    9px 14px;

    white-space:nowrap;
}


.channelLine{

    display:flex;

    align-items:center;

    gap:10px;

    padding:12px;

    border-top:
    1px solid var(--line);

    border-bottom:
    1px solid var(--line);
}


.subscribe{

    margin-left:auto;

    background:
    var(--green);

    color:white;

    border:0;

    border-radius:18px;

    padding:
    9px 15px;
}


.desc{

    padding:14px;

    line-height:1.5;

    color:#ddd;
}


/* =========================
   SHORTS
========================= */

.shorts{

    position:fixed;

    inset:0;

    background:#000;

    z-index:3500;

    display:none;

    overflow-y:auto;

    scroll-snap-type:y mandatory;
}


.shorts.open{

    display:block;
}


.short{

    height:100vh;

    scroll-snap-align:start;

    position:relative;

    background:#000;
}


.short video{

    width:100%;

    height:100%;

    object-fit:cover;
}


.shortShade{

    position:absolute;

    left:14px;

    right:75px;

    bottom:32px;

    text-shadow:
    0 2px 5px #000;
}


.shortTitle{

    font-weight:700;

    font-size:18px;
}


.shortMeta{

    margin-top:6px;

    color:#ddd;
}


.shortTools{

    position:absolute;

    right:13px;

    bottom:95px;

    display:flex;

    flex-direction:column;

    gap:16px;

    align-items:center;
}


.st{

    border:0;

    background:#0008;

    color:#fff;

    border-radius:50%;

    width:45px;

    height:45px;

    font-size:20px;
}


.closeShorts{

    position:fixed;

    right:13px;

    top:13px;

    z-index:3600;

    background:#0008;

    color:#fff;

    border:0;

    border-radius:50%;

    width:42px;

    height:42px;

    font-size:25px;
}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    bottom:82px;

    left:50%;

    transform:
    translateX(-50%);

    background:#333;

    color:white;

    padding:
    11px 16px;

    border-radius:8px;

    z-index:6000;

    display:none;
}


.toast.show{

    display:block;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .thumb{

        border-radius:9px;
    }

    .video{

        margin-bottom:25px;
    }

}

</style>

</head>


<body>

<script>


/* =========================================

const IMG=[

];



/* =========================================

========================================= */

const baseVideos=[


{

},


{

img:IMG[3],

src:""

},


{

id:5,

cat:"Stories",

title:

channel:
"Islamic Stories",

duration:"28:55",

img:IMG[4],

},


{

},


{

id:7,

cat:"Quran",

channel:
"Quran World",

time:"4 months ago",

duration:"36:09",

img:IMG[0],

src:""

},


{

id:8,

cat:"Kids",

title:
"Islamic Story For Kids",

channel:
"Islamic Kids",

views:"540K",

time:"3 days ago",

duration:"14:32",

img:IMG[2],

src:""

}

];



/* =========================================
   POSTS
========================================= */

const posts=[

{

id:"p1",

channel:"Islamic Daily",

text:
"May Allah make our hearts connected with the Quran. Ameen."

},

{

id:"p2",

channel:"Deen Network",

text:
"A small reminder: keep making dua and never lose hope in Allah."

}

];



/* =========================================
   SHORTS
========================================= */

const shortData=[

{

title:
"Beautiful Quran Reminder",

channel:
"Islamic Shorts",

src:""

},

{

title:
"Never Give Up On Dua",

channel:
"Daily Deen",

src:""

},

{

title:
"Remember Allah Every Day",

channel:
"Islamic Reminder",

src:""

}

];



/* =========================================
   VARIABLES
========================================= */

let category="All";

let page=0;

let busy=false;

let query="";



/* =========================================
   LOCAL STORAGE
========================================= */

function key(k){

return "islamtube_"+k;

}


function get(k,def=[]){

try{

return JSON.parse(
localStorage.getItem(key(k))
) ?? def;

}

catch{

return def;

}

}


function set(k,v){

localStorage.setItem(
key(k),
JSON.stringify(v)
);

}



/* =========================================
   TOAST
========================================= */

function toast(t){

const e=
document.getElementById("toast");

e.textContent=t;

e.classList.add("show");

setTimeout(()=>{

e.classList.remove("show");

},1800);

}



/* =========================================
   NAVIGATION ACTIVE
========================================= */

function setNav(p){

document
.querySelectorAll(".nav")
.forEach(x=>{

x.classList.toggle(
"active",
x.dataset.page===p
);

});

}



/* =========================================
   SEARCH OPEN
========================================= */

function toggleSearch(){

const p=
document.getElementById(
"searchPanel"
);

p.classList.toggle("open");

if(
p.classList.contains("open")
){

document
.getElementById("searchInput")
.focus();

}

}


function clearSearch(){

document
.getElementById("searchInput")
.value="";

query="";

renderHome(true);

}


function searchNow(){

query=
document
.getElementById("searchInput")
.value
.toLowerCase();

renderHome(true);

}



/* =========================================
   CATEGORY
========================================= */

function filterCat(c,b){

category=c;

document
.querySelectorAll(".chip")
.forEach(x=>
x.classList.remove("active")
);

b.classList.add("active");

renderHome(true);

}



/* =========================================
   CREATE INFINITE LIST
========================================= */

function videoList(){

let a=[];

for(
let i=0;
i<100;
i++
){

baseVideos.forEach(v=>{

a.push({

...v,

id:v.id+"_"+i

});

});

}

return a;

}



/* =========================================
   VIDEO CARD
========================================= */

function videoCard(v){

return `

<article class="video">


<div
class="thumb"
onclick='openVideo(${JSON.stringify(v)})'>


<img
src="${v.img}"
loading="lazy">


<span class="duration">

${v.duration}

</span>


</div>



<div class="info">


<div class="avatar">

${v.channel[0]}

</div>



<div
class="details"
onclick='openVideo(${JSON.stringify(v)})'>


<div class="title">

${v.title}

</div>


<div class="meta">

${v.channel}

•

${v.views}

views

•

${v.time}

</div>


</div>



<button
class="more"
onclick="event.stopPropagation();moreMenu()">

⋮

</button>


</div>


</article>

`;

}



/* =========================================
   POST CARD
========================================= */

function postCard(p){

return `

<article class="post">


<div class="postHead">

<div class="avatar">

${p.channel[0]}

</div>

<b>

${p.channel}

</b>

</div>



<div class="postText">

${p.text}

</div>



<div class="postBtns">

<span>♡ Like</span>

<span>♧ Comment</span>

<span>↗ Share</span>

</div>


</article>

`;

}



/* =========================================
   HOME
========================================= */

function renderHome(reset=false){

if(reset){

page=0;

document
.getElementById("main")
.innerHTML="";

}

setNav("home");

document
.getElementById("chips")
.style.display="flex";

loadMore();

}



/* =========================================
   LOAD MORE
========================================= */

function loadMore(){

if(busy)return;

busy=true;

document
.getElementById("loading")
.style.display="block";


setTimeout(()=>{


const all=
videoList();


let start=
page*8;


let end=
start+8;


let arr=
all.slice(start,end);



arr=
arr.filter(v=>{

return (

category==="All"

||

v.cat===category

)

&&

(

!query

||

v.title
.toLowerCase()
.includes(query)

||

v.channel
.toLowerCase()
.includes(query)

);

});



let out="";



arr.forEach((v,i)=>{


out+=
videoCard(v);



/* post after video */

if(

i===3

&&

category==="All"

&&

!query

){

out+=
postCard(
posts[
page%
posts.length
]
);

}

});



if(out===""){

out=
`<div class="empty">
No results found.
