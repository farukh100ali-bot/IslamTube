<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IslamTube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0F0F0F; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .green-theme { color: #00E676; }
    .bg-green-theme { background-color: #00E676; }
    .yt-green-logo {
      background: #00E676;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 24px;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between border-x border-zinc-800 relative bg-[#0F0F0F]">

  <!-- TOP HEADER -->
  <header class="flex items-center justify-between px-4 py-2.5 sticky top-0 bg-[#0F0F0F] z-30 border-b border-zinc-800">
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('home')">
      <div class="yt-green-logo">
        <i class="fa-solid fa-play text-black text-xs ml-0.5"></i>
      </div>
      <span class="font-bold text-lg tracking-tight">IslamTube</span>
    </div>
    <div class="flex items-center gap-4 text-lg text-zinc-200">
      <i class="fa-solid fa-tv cursor-pointer hover:text-[#00E676]" onclick="alert('Cast to TV feature')"></i>
      <div class="relative cursor-pointer" onclick="openPage('notifications-page')">
        <i class="fa-regular fa-bell hover:text-[#00E676]"></i>
        <span class="absolute -top-1 -right-1 bg-[#00E676] text-black font-bold text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center">3</span>
      </div>
      <i class="fa-solid fa-magnifying-glass cursor-pointer hover:text-[#00E676]" onclick="alert('Search IslamTube')"></i>
      <div class="w-7 h-7 rounded-full bg-[#00E676] text-black font-bold flex items-center justify-center text-xs cursor-pointer" onclick="switchTab('library')">M</div>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT CONTAINER -->
  <main id="main-content" class="flex-1 overflow-y-auto pb-16">
    <!-- Pages will render dynamically via JavaScript -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="flex justify-around items-center py-2 px-1 bg-[#0F0F0F]/95 backdrop-blur border-t border-zinc-800 text-[10px] fixed bottom-0 w-full max-w-md z-30">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-[#00E676]">
      <i class="fa-solid fa-house text-lg mb-0.5"></i>
      <span>Home</span>
    </button>
    <button onclick="switchTab('shorts')" id="nav-shorts" class="flex flex-col items-center text-zinc-400">
      <i class="fa-solid fa-bolt text-lg mb-0.5"></i>
      <span>Shorts</span>
    </button>
    <button onclick="openPage('create-page')" class="flex flex-col items-center text-[#00E676]">
      <i class="fa-solid fa-circle-plus text-3xl"></i>
    </button>
    <button onclick="switchTab('subscriptions')" id="nav-subscriptions" class="flex flex-col items-center text-zinc-400">
      <i class="fa-regular fa-folder-closed text-lg mb-0.5"></i>
      <span>Subscriptions</span>
    </button>
    <button onclick="switchTab('library')" id="nav-library" class="flex flex-col items-center text-zinc-400">
      <i class="fa-solid fa-user text-lg mb-0.5"></i>
      <span>Library</span>
    </button>
  </nav>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    // State management
    let activeTab = 'home';
    let isSubscribed = {};

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#00E676]', 'text-zinc-400'));
      const activeBtn = document.getElementById(`nav-${tab}`);
      if(activeBtn) activeBtn.classList.replace('text-zinc-400', 'text-[#00E676]');
      
      const main = document.getElementById('main-content');
      window.scrollTo(0, 0);

      if (tab === 'home') renderHome();
      else if (tab === 'shorts') renderShorts();
      else if (tab === 'subscriptions') renderSubscriptions();
      else if (tab === 'library') renderLibrary();
    }

    function toggleSub(id, btnElement) {
      isSubscribed[id] = !isSubscribed[id];
      if (isSubscribed[id]) {
        btnElement.innerHTML = `<i class="fa-regular fa-bell text-sm"></i> Subscribed <i class="fa-solid fa-chevron-down text-[10px]"></i>`;
        btnElement.className = "bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium";
      } else {
        btnElement.innerHTML = "Subscribe";
        btnElement.className = "bg-[#00E676] text-black font-bold text-xs px-4 py-1.5 rounded-full";
      }
    }

    // 1. HOME SCREEN
    function renderHome() {
      document.getElementById('main-content').innerHTML = `
        <!-- Categories -->
        <div class="flex gap-2 px-3 py-2 overflow-x-auto no-scrollbar bg-[#0F0F0F] sticky top-0 z-10 border-b border-zinc-800/50">
          <button class="bg-[#00E676] text-black font-semibold text-xs px-3 py-1.5 rounded-lg whitespace-nowrap">All</button>
          <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap">Quran</button>
          <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap">Naat Sharif</button>
          <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap">Islamic Bayan</button>
          <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap">Stories</button>
        </div>

        <!-- Long Video 1 -->
        <div class="flex flex-col cursor-pointer border-b border-zinc-800/40" onclick="openPlayer('Surah Yaseen | Heart Touching Tilawat', 'Quran TV', '2.4M views • 3 days ago')">
          <div class="relative w-full h-52 bg-zinc-900 flex items-center justify-center">
            <div class="w-14 h-14 rounded-full bg-black/60 flex items-center justify-center">
              <i class="fa-solid fa-play text-2xl text-[#00E676] ml-1"></i>
            </div>
            <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-1.5 py-0.5 rounded text-white font-mono">12:45</span>
          </div>
          <div class="flex gap-3 p-3">
            <div onclick="event.stopPropagation(); openChannel('Quran TV')" class="w-9 h-9 rounded-full bg-emerald-900 text-[#00E676] font-bold flex items-center justify-center text-xs flex-shrink-0 border border-[#00E676]">Q</div>
            <div class="flex-1">
              <h3 class="font-medium text-sm line-clamp-2 leading-snug">Surah Yaseen | Surah Rahman | Surah Waqia - Beautiful Recitation</h3>
              <p class="text-xs text-zinc-400 mt-1">Quran TV • 2.4M views • 3 days ago</p>
            </div>
            <button onclick="event.stopPropagation(); toggleSub('quran_tv', this)" class="bg-[#00E676] text-black font-bold text-xs px-3 py-1 h-7 rounded-full self-start">Subscribe</button>
          </div>
        </div>

        <!-- Shorts Shelf -->
        <div class="py-3 px-3 border-b border-zinc-800">
          <div class="flex items-center gap-2 mb-2 text-[#00E676]">
            <i class="fa-solid fa-bolt"></i>
            <span class="font-bold text-sm text-white">Shorts</span>
          </div>
          <div class="flex gap-2 overflow-x-auto no-scrollbar">
            <div onclick="switchTab('shorts')" class="w-32 h-52 rounded-xl bg-zinc-800 relative flex-shrink-0 overflow-hidden flex items-end p-2 cursor-pointer">
              <div class="absolute inset-0 flex items-center justify-center bg-zinc-900"><i class="fa-solid fa-play text-2xl text-[#00E676]"></i></div>
              <p class="text-xs font-semibold text-white z-10 line-clamp-2">Heart Touching Prophet Story #Shorts</p>
            </div>
            <div onclick="switchTab('shorts')" class="w-32 h-52 rounded-xl bg-zinc-800 relative flex-shrink-0 overflow-hidden flex items-end p-2 cursor-pointer">
              <div class="absolute inset-0 flex items-center justify-center bg-zinc-900"><i class="fa-solid fa-play text-2xl text-[#00E676]"></i></div>
              <p class="text-xs font-semibold text-white z-10 line-clamp-2">Madina Sharif Status 2026</p>
            </div>
          </div>
        </div>

        <!-- Community Post Card -->
        <div class="p-3 border-b border-zinc-800 bg-zinc-900/30">
          <div class="flex items-center gap-2 mb-2">
            <div onclick="openChannel('Islamic Releases')" class="w-8 h-8 rounded-full bg-emerald-800 flex items-center justify-center text-xs font-bold text-[#00E676]">I</div>
            <div>
              <h4 class="text-xs font-bold">Islamic Releases</h4>
              <p class="text-[10px] text-zinc-400">Jummah Mubarak to all Muslims! Remember us in your prayers.</p>
            </div>
          </div>
          <div class="h-40 bg-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs my-2">Post Image</div>
          <div class="flex gap-6 text-zinc-400 text-xs mt-2">
            <button class="flex items-center gap-1 hover:text-[#00E676]"><i class="fa-regular fa-thumbs-up"></i> 12K</button>
            <button class="flex items-center gap-1 hover:text-[#00E676]"><i class="fa-regular fa-comment"></i> 432</button>
          </div>
        </div>

        <!-- Long Video 2 -->
        <div class="flex flex-col cursor-pointer" onclick="openPlayer('Beautiful Naat Sharif 2026', 'Naat Studio', '1.1M views • 1 week ago')">
          <div class="relative w-full h-52 bg-zinc-900 flex items-center justify-center">
            <div class="w-14 h-14 rounded-full bg-black/60 flex items-center justify-center">
              <i class="fa-solid fa-play text-2xl text-[#00E676] ml-1"></i>
            </div>
            <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-1.5 py-0.5 rounded text-white font-mono">06:38</span>
          </div>
          <div class="flex gap-3 p-3">
            <div onclick="event.stopPropagation(); openChannel('Naat Studio')" class="w-9 h-9 rounded-full bg-emerald-900 text-[#00E676] font-bold flex items-center justify-center text-xs flex-shrink-0 border border-[#00E676]">N</div>
            <div class="flex-1">
              <h3 class="font-medium text-sm line-clamp-2 leading-snug">Beautiful Kids Naat Sharif | Sohna Madina Mubarak</h3>
              <p class="text-xs text-zinc-400 mt-1">Naat Studio • 1.1M views • 1 week ago</p>
            </div>
            <button onclick="event.stopPropagation(); toggleSub('naat_studio', this)" class="bg-[#00E676] text-black font-bold text-xs px-3 py-1 h-7 rounded-full self-start">Subscribe</button>
          </div>
        </div>
      `;
    }

    // 2. SHORTS TIKTOK STYLE
    function renderShorts() {
      document.getElementById('main-content').innerHTML = `
        <div class="h-[calc(100vh-105px)] w-full bg-zinc-900 relative flex flex-col justify-between p-4 overflow-hidden">
          <div class="absolute inset-0 flex items-center justify-center">
            <i class="fa-solid fa-play text-6xl text-[#00E676]/40"></i>
          </div>
          
          <div class="z-10 flex justify-between items-center text-white">
            <span class="font-bold text-lg">Shorts</span>
            <i class="fa-solid fa-camera"></i>
          </div>

          <!-- Right Action Bar -->
          <div class="absolute right-3 bottom-20 flex flex-col items-center gap-5 z-10 text-white text-xs">
            <button class="flex flex-col items-center"><i class="fa-solid fa-thumbs-up text-2xl"></i><span>124K</span></button>
            <button class="flex flex-col items-center"><i class="fa-solid fa-thumbs-down text-2xl"></i><span>Dislike</span></button>
            <button class="flex flex-col items-center"><i class="fa-solid fa-comment text-2xl"></i><span>1,432</span></button>
            <button class="flex flex-col items-center"><i class="fa-solid fa-share text-2xl"></i><span>Share</span></button>
          </div>

          <!-- Bottom Channel Info -->
          <div class="z-10 max-w-[80%] space-y-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-[#00E676] text-black font-bold flex items-center justify-center text-xs">I</div>
              <span class="font-bold text-sm">@islamic_studio</span>
              <button onclick="toggleSub('shorts_chan', this)" class="bg-[#00E676] text-black font-bold text-xs px-3 py-1 rounded-full ml-2">Subscribe</button>
            </div>
            <p class="text-xs text-zinc-200 line-clamp-2">Heart Touching Masjid Al Haram Recitation ❤️ #naat #islam</p>
          </div>
        </div>
      `;
    }

    // 3. SUBSCRIPTIONS PAGE
    function renderSubscriptions() {
      document.getElementById('main-content').innerHTML = `
        <!-- Channels Horizontal List -->
        <div class="flex gap-4 p-3 border-b border-zinc-800 overflow-x-auto no-scrollbar bg-zinc-900/30">
          <div onclick="openChannel('Quran TV')" class="flex flex-col items-center gap-1 cursor-pointer min-w-[50px]">
            <div class="w-12 h-12 rounded-full border-2 border-[#00E676] bg-emerald-900 flex items-center justify-center font-bold text-[#00E676]">Q</div>
            <span class="text-[10px] text-zinc-300 truncate w-12 text-center">Quran TV</span>
          </div>
          <div onclick="openChannel('Naat World')" class="flex flex-col items-center gap-1 cursor-pointer min-w-[50px]">
            <div class="w-12 h-12 rounded-full border-2 border-[#00E676] bg-emerald-900 flex items-center justify-center font-bold text-[#00E676]">N</div>
            <span class="text-[10px] text-zinc-300 truncate w-12 text-center">Naat World</span>
          </div>
          <div onclick="openChannel('Islamic Studio')" class="flex flex-col items-center gap-1 cursor-pointer min-w-[50px]">
            <div class="w-12 h-12 rounded-full border-2 border-[#00E676] bg-emerald-900 flex items-center justify-center font-bold text-[#00E676]">I</div>
            <span class="text-[10px] text-zinc-300 truncate w-12 text-center">Islamic...</span>
          </div>
        </div>

        <div class="p-3 text-xs font-bold text-[#00E676]">Latest Updates</div>

        <div class="space-y-4 px-3">
          <div class="flex gap-3 bg-zinc-900/40 p-2 rounded-xl border border-zinc-800 cursor-pointer" onclick="openPlayer('Surah Mulk Tilawat', 'Quran TV', '10K views')">
            <div class="w-28 h-18 bg-zinc-800 rounded-lg flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-play text-[#00E676]"></i></div>
            <div>
              <h4 class="text-xs font-bold">Surah Mulk Daily Tilawat</h4>
              <p class="text-[10px] text-zinc-400 mt-1">Quran TV • 2 hours ago</p>
            </div>
          </div>
        </div>
      `;
    }

    // 4. LIBRARY / PROFILE & SETTINGS
    function renderLibrary() {
      document.getElementById('main-content').innerHTML = `
        <div class="p-4 space-y-4">
          <!-- Profile Header -->
          <div class="flex items-center gap-3 pb-4 border-b border-zinc-800">
            <div class="w-14 h-14 rounded-full bg-[#00E676] text-black font-bold text-xl flex items-center justify-center">M</div>
            <div>
              <h2 class="font-bold text-base">IslamTube User</h2>
              <button onclick="openChannel('My Channel')" class="text-xs text-[#00E676] font-medium mt-0.5">Create Channel / View Channel</button>
            </div>
            <i class="fa-solid fa-gear ml-auto text-xl text-zinc-400 cursor-pointer" onclick="alert('Settings Panel')"></i>
          </div>

          <!-- Options List -->
          <div class="space-y-3 text-sm">
            <div class="flex items-center gap-3 p-2 hover:bg-zinc-800 rounded-lg cursor-pointer"><i class="fa-solid fa-history text-[#00E676]"></i><span>History</span></div>
            <div class="flex items-center gap-3 p-2 hover:bg-zinc-800 rounded-lg cursor-pointer"><i class="fa-solid fa-list-check text-[#00E676]"></i><span>Playlists</span></div>
            <div class="flex items-center gap-3 p-2 hover:bg-zinc-800 rounded-lg cursor-pointer"><i class="fa-solid fa-download text-[#00E676]"></i><span>Downloaded Videos</span></div>
            <div class="flex items-center gap-3 p-2 hover:bg-zinc-800 rounded-lg cursor-pointer"><i class="fa-regular fa-clock text-[#00E676]"></i><span>Watch Later</span></div>
            <div class="flex items-center gap-3 p-2 hover:bg-zinc-800 rounded-lg cursor-pointer"><i class="fa-regular fa-thumbs-up text-[#00E676]"></i><span>Liked Videos</span></div>
          </div>
        </div>
      `;
    }

    // DYNAMIC SINGLE VIDEO PLAYER PAGE
    function openPlayer(title, channel, stats) {
      document.getElementById('main-content').innerHTML = `
        <div class="w-full bg-black">
          <div class="w-full h-56 bg-zinc-900 relative flex items-center justify-center">
            <i class="fa-solid fa-circle-play text-6xl text-[#00E676]"></i>
            <button onclick="switchTab('home')" class="absolute top-3 left-3 bg-black/60 w-8 h-8 rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-arrow-left"></i></button>
          </div>
          <div class="p-3 space-y-3">
            <h1 class="font-bold text-base">${title}</h1>
            <p class="text-xs text-zinc-400">${stats}</p>
            
            <div class="flex items-center justify-between py-2 border-y border-zinc-800">
              <div class="flex items-center gap-2" onclick="openChannel('${channel}')">
                <div class="w-8 h-8 rounded-full bg-[#00E676] text-black font-bold flex items-center justify-center text-xs">${channel[0]}</div>
                <span class="font-bold text-xs">${channel}</span>
              </div>
              <button onclick="toggleSub('player_sub', this)" class="bg-[#00E676] text-black font-bold text-xs px-4 py-1.5 rounded-full">Subscribe</button>
            </div>

            <div class="flex gap-4 overflow-x-auto py-2 text-xs no-scrollbar">
              <button class="bg-zinc-800 px-3 py-1.5 rounded-full flex items-center gap-1.5"><i class="fa-regular fa-thumbs-up"></i> Like</button>
              <button class="bg-zinc-800 px-3 py-1.5 rounded-full flex items-center gap-1.5"><i class="fa-solid fa-share"></i> Share</button>
              <button class="bg-zinc-800 px-3 py-1.5 rounded-full flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Download</button>
            </div>

            <!-- Comments Preview -->
            <div class="bg-zinc-900 p-3 rounded-xl space-y-1">
              <div class="flex justify-between text-xs font-bold"><span>Comments</span><span class="text-zinc-400">1.2K</span></div>
              <p class="text-xs text-zinc-300">SubhanAllah very beautiful recitation! ❤️</p>
            </div>
          </div>
        </div>
      `;
    }

    // CHANNEL VIEW PAGE
    function openChannel(name) {
      document.getElementById('main-content').innerHTML = `
        <div class="w-full">
          <div class="h-28 bg-emerald-950 flex items-center justify-center text-emerald-400 font-bold text-lg border-b border-[#00E676]/30">
            سبحان الله وبحمده سبحان الله العظيم
          </div>
          <div class="p-4 space-y-3">
            <div class="flex items-center gap-3">
              <div class="w-16 h-16 rounded-full bg-[#00E676] text-black font-bold text-2xl flex items-center justify-center">${name[0]}</div>
              <div>
                <h2 class="font-bold text-lg">${name}</h2>
                <p class="text-xs text-zinc-400">@${name.toLowerCase().replace(/\s+/g, '')} • 1.2M subscribers</p>
              </div>
