<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IslamTube</title>
    <style>
        body {
            margin: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Roboto, Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .play-icon {
            width: 30px;
            height: 22px;
            background-color: #2e7d32; /* Islamic Green */
            border-radius: 6px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-icon::after {
            content: '';
            border-left: 8px solid white;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            margin-left: 2px;
        }
        .logo-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: -1px;
        }
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 15px;
            background-color: #0f0f0f;
            white-space: nowrap;
            border-bottom: 1px solid #383838;
        }
        .categories::-webkit-scrollbar { display: none; }
        .chip {
            background-color: #383838;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .chip.active {
            background-color: #ffffff;
            color: #000000;
        }
        .video-card {
            margin-bottom: 25px;
        }
        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .video-info {
            padding: 12px 15px;
            display: flex;
            gap: 12px;
        }
        .channel-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #2e7d32;
        }
        .video-text { flex: 1; }
        .video-title {
            font-size: 16px;
            margin: 0 0 5px 0;
            line-height: 1.4;
        }
        .video-details {
            font-size: 12px;
            color: #aaa;
            margin: 0;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #383838;
        }
        .nav-item {
            font-size: 10px;
            color: #ffffff;
            text-align: center;
            opacity: 0.7;
        }
        .nav-item.active { opacity: 1; }
        
        /* Splash Screen Styles */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f0f0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .splash-logo {
            width: 90px;
            height: 64px;
            background-color: #2e7d32;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .splash-logo::after {
            content: '';
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }
        .splash-text {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo"></div>
        <div class="splash-text">IslamTube</div>
    </div>

    <header>
        <div class="logo-group">
            <div class="play-icon"></div>
            <div class="logo-text">IslamTube</div>
        </div>
    </header>

    <div class="categories">
        <div class="chip active">All</div>
        <div class="chip">Quran</div>
        <div class="chip">Lectures</div>
        <div class="chip">Naats</div>
        <div class="chip">Stories</div>
        <div class="chip">Nasheeds</div>
    </div>

    <div class="video-card">
        <div class="thumbnail">Video Preview</div>
        <div class="video-info">
            <div class="channel-icon"></div>
            <div class="video-text">
                <h3 class="video-title">Beautiful Quran Recitation That Soothes The Heart</h3>
                <p class="video-details">Islamic Daily • 1.2M views • 1 month ago</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">Home</div>
        <div class="nav-item">Shorts</div>
        <div class="nav-item">Subscriptions</div>
        <div class="nav-item">Library</div>
    </div>

    <script>
        // Hide splash screen after 2 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 2000);
        });
    </script>
</body>
                                      </html>
