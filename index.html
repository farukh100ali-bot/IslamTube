<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islamtube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#080808] text-white min-h-screen flex flex-col font-sans pb-20 select-none">

  <!-- 1. TOP APP BAR (EXACT MATCH) -->
  <header class="sticky top-0 z-50 bg-[#080808] flex items-center justify-between px-4 py-3 border-b border-[#181818]">
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.location.reload()">
      <div class="w-7 h-7 bg-[#86efac] rounded-lg flex items-center justify-center shadow-sm">
        <i class="fa-solid fa-play text-black text-xs"></i>
      </div>
      <span class="font-bold text-xl tracking-tight">Islam<span class="text-[#86efac]">tube</span></span>
    </div>
    <div class="flex items-center gap-5 text-xl">
      <a href="notifications.html" class="text-gray-200 hover:text-[#86efac]"><i class="fa-regular fa-bell"></i></a>
      <a href="search.html" class="text-gray-200 hover:text-[#86efac]"><i class="fa-solid fa-magnifying-glass"></i></a>
    </div>
  </header>

  <!-- 2. CATEGORY HORIZONTAL BAR -->
  <div class="sticky top-[53px] z-40 bg-[#080808] px-3 py-2.5 flex items-center gap-2.5 overflow-x-auto no-scrollbar border-b border-[#181818]">
    <button class="bg-[#181818] text-gray-300 p-2 rounded-xl border border-[#282828] shrink-0 hover:border-[#86efac]">
      <i class="fa-solid fa-compass text-xs text-[#86efac]"></i>
    </button>
    <button class="bg-[#86efac] text-black font-semibold px-4 py-1.5 rounded-xl text-xs shrink-0">All</button>
    <button class="bg-[#181818] text-gray-200 px-4 py-1.5 rounded-xl text-xs shrink-0 border border-[#282828] hover:border-[#86efac]">Quran</button>
    <button class="bg-[#181818] text-gray-200 px-4 py-1.5 rounded-xl text-xs shrink-0 border border-[#282828] hover:border-[#86efac]">Hadees</button>
    <button class="bg-[#181818] text-gray-200 px-4 py-1.5 rounded-xl text-xs shrink-0 border border-[#282828] hover:border-[#86efac]">Bayaan</button>
    <button class="bg-[#181818] text-gray-200 px-4 py-1.5 rounded-xl text-xs shrink-0 border border-[#282828] hover:border-[#86efac]">Nasheed</button>
  </div>

  <!-- 3. MAIN HOME FEED CONTENT -->
  <main class="flex-1 p-3 space-y-5 max-w-2xl mx-auto w-full">
    
    <!-- Live Stream Video Card -->
    <div class="bg-[#121212] border border-[#222] rounded-2xl overflow-hidden shadow-lg cursor-pointer">
      <div class="relative aspect-video bg-gray-900">
        <img src="https://picsum.photos/600/340?random=101" class="w-full h-full object-cover">
        <span class="absolute bottom-3 right-3 bg-red-600 text-white font-bold text-[10px] px-2 py-0.5 rounded-md flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> LIVE
        </span>
      </div>
      <div class="p-3.5 flex gap-3 items-start">
        <div class="relative">
          <img src="https://picsum.photos/50/50?random=11" class="w-10 h-10 rounded-full border-2 border-[#86efac]">
          <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-red-600 text-[8px] text-white px-1 rounded font-bold">LIVE</span>
        </div>
        <div class="flex-1">
          <h3 class="font-bold text-sm leading-snug line-clamp-2">Quran Aur Hadees Ki Roshni Mein Zindagi | By Dr Israr Ahmed</h3>
          <p class="text-xs text-gray-400 mt-1">Islamic Teacher • <span class="text-gray-300">2.1K watching</span></p>
        </div>
        <button class="text-gray-400 p-1 hover:text-white"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </div>

    <!-- Shorts Section -->
    <div class="pt-2">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 bg-[#86efac] rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-bolt text-black text-xs"></i>
          </div>
          <h2 class="font-bold text-base">Shorts</h2>
        </div>
        <button class="text-gray-400 hover:text-white"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>

      <!-- Shorts Grid -->
      <div class="grid grid-cols-2 gap-3">
        <!-- Shorts Card 1 -->
        <a href="shorts.html" class="h-[260px] bg-gray-900 rounded-2xl relative overflow-hidden border border-[#222] shadow-md block">
          <img src="https://picsum.photos/250/400?random=201" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          <p class="absolute top-3 left-3 text-xs font-bold text-white drop-shadow">Jumma Mubarak 💚🕋💚</p>
          <div class="absolute bottom-3 left-3 right-3 text-xs font-semibold text-white">
            <p class="line-clamp-2 drop-shadow">Jumma Mubarak</p>
          </div>
        </a>

        <!-- Shorts Card 2 -->
        <a href="shorts.html" class="h-[260px] bg-gray-900 rounded-2xl relative overflow-hidden border border-[#222] shadow-md block">
          <img src="https://picsum.photos/250/400?random=202" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          <span class="absolute top-3 left-3 bg-[#86efac] text-black font-bold text-[10px] px-2 py-0.5 rounded-md">New</span>
          <p class="absolute top-3 right-3 text-xs font-bold text-white drop-shadow">SubhanAllah 🤍✨</p>
          <div class="absolute bottom-3 left-3 right-3 text-xs font-semibold text-white">
            <p class="line-clamp-2 drop-shadow">سُبْحَانَ ٱللَّٰهِ</p>
          </div>
        </a>
      </div>
    </div>

  </main>

  <!-- 4. BOTTOM NAVIGATION BAR (EXACT MATCH) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#080808] border-t border-[#181818] flex justify-around items-center py-2 z-50 text-[10px] text-gray-400">
    <a href="index.html" class="flex flex-col items-center text-[#86efac] font-medium">
      <i class="fa-solid fa-house text-base mb-0.5"></i>
      <span>Home</span>
    </a>
    <a href="shorts.html" class="flex flex-col items-center hover:text-[#86efac]">
      <i class="fa-solid fa-bolt text-base mb-0.5"></i>
      <span>Shorts</span>
    </a>
    
    <!-- CENTER PLUS BUTTON -->
    <a href="upload.html" class="flex items-center justify-center bg-[#86efac] text-black w-10 h-10 rounded-full shadow-lg -mt-3">
      <i class="fa-solid fa-plus text-xl"></i>
    </a>

    <a href="subscriptions.html" class="flex flex-col items-center hover:text-[#86efac]">
      <i class="fa-solid fa-circle-play text-base mb-0.5"></i>
      <span>Subscriptions</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center hover:text-[#86efac]">
      <div class="w-5 h-5 rounded-full border border-[#86efac] overflow-hidden mb-0.5">
        <img src="https://picsum.photos/50/50?random=11" class="w-full h-full object-cover">
      </div>
      <span>You</span>
    </a>
  </nav>

</body>
                                                                         </html>
