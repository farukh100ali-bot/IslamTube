<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IslamTube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0F0F0F; color: #ffffff; font-family: sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between border-x border-zinc-800">

  <!-- Top Header -->
  <header class="flex items-center justify-between px-4 py-3 sticky top-0 bg-[#0F0F0F] z-20 border-b border-zinc-800">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-circle-play text-2xl text-[#00C853]"></i>
      <span class="font-bold text-xl tracking-tight">IslamTube</span>
    </div>
    <div class="flex items-center gap-4 text-lg text-zinc-200">
      <i class="fa-solid fa-tv cursor-pointer hover:text-[#00C853]"></i>
      <i class="fa-regular fa-bell cursor-pointer hover:text-[#00C853]"></i>
      <i class="fa-solid fa-magnifying-glass cursor-pointer hover:text-[#00C853]"></i>
      <div class="w-7 h-7 rounded-full bg-[#00C853] text-black font-bold flex items-center justify-center text-xs">M</div>
    </div>
  </header>

  <!-- Category Filter Chips -->
  <div class="flex gap-2 px-3 py-2 overflow-x-auto no-scrollbar bg-[#0F0F0F] sticky top-[53px] z-10">
    <button class="bg-[#00C853] text-black font-semibold text-xs px-3 py-1.5 rounded-lg whitespace-nowrap">All</button>
    <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap hover:bg-zinc-700">Quran</button>
    <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap hover:bg-zinc-700">Naat</button>
    <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap hover:bg-zinc-700">Molvi</button>
    <button class="bg-zinc-800 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap hover:bg-zinc-700">Islamic Stories</button>
  </div>

  <!-- Main Video Feed Area -->
  <main class="flex-1 overflow-y-auto space-y-4 pb-4">
    
    <!-- Video Card 1 -->
    <div class="flex flex-col cursor-pointer">
      <div class="relative w-full h-48 bg-zinc-900 flex items-center justify-center">
        <i class="fa-solid fa-circle-play text-5xl text-[#00C853] opacity-90"></i>
        <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-1.5 py-0.5 rounded text-white font-mono">12:45</span>
      </div>
      <div class="flex gap-3 p-3">
        <div class="w-9 h-9 rounded-full bg-zinc-700 flex-shrink-0 flex items-center justify-center font-bold text-xs text-[#00C853]">Q</div>
        <div class="flex-1">
          <h3 class="font-medium text-sm line-clamp-2 leading-snug">Surah Yaseen | Surah Rahman | Surah Waqia</h3>
          <p class="text-xs text-zinc-400 mt-1">Quran TV • 2.4M views • 3 days ago</p>
        </div>
        <i class="fa-solid fa-ellipsis-vertical text-zinc-400 text-sm"></i>
      </div>
    </div>

    <!-- Video Card 2 -->
    <div class="flex flex-col cursor-pointer">
      <div class="relative w-full h-48 bg-zinc-900 flex items-center justify-center">
        <i class="fa-solid fa-circle-play text-5xl text-[#00C853] opacity-90"></i>
        <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-1.5 py-0.5 rounded text-white font-mono">06:38</span>
      </div>
      <div class="flex gap-3 p-3">
        <div class="w-9 h-9 rounded-full bg-zinc-700 flex-shrink-0 flex items-center justify-center font-bold text-xs text-[#00C853]">K</div>
        <div class="flex-1">
          <h3 class="font-medium text-sm line-clamp-2 leading-snug">Beautiful Kids Naat | Sohna Madina</h3>
          <p class="text-xs text-zinc-400 mt-1">Kids Naat Studio • 1.1M views • 1 week ago</p>
        </div>
        <i class="fa-solid fa-ellipsis-vertical text-zinc-400 text-sm"></i>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="flex justify-around items-center py-2 px-1 bg-[#0F0F0F] border-t border-zinc-800 text-[10px] sticky bottom-0">
    <div class="flex flex-col items-center text-[#00C853] cursor-pointer">
      <i class="fa-solid fa-house text-lg mb-0.5"></i>
      <span>Home</span>
    </div>
    <div class="flex flex-col items-center text-zinc-400 cursor-pointer hover:text-[#00C853]">
      <i class="fa-solid fa-bolt text-lg mb-0.5"></i>
      <span>Shorts</span>
    </div>
    <div class="flex flex-col items-center text-[#00C853] cursor-pointer">
      <i class="fa-solid fa-circle-plus text-3xl"></i>
    </div>
    <div class="flex flex-col items-center text-zinc-400 cursor-pointer hover:text-[#00C853]">
      <i class="fa-regular fa-bell text-lg mb-0.5"></i>
      <span>Subscriptions</span>
    </div>
    <div class="flex flex-col items-center text-zinc-400 cursor-pointer hover:text-[#00C853]">
      <i class="fa-solid fa-folder-closed text-lg mb-0.5"></i>
      <span>Library</span>
    </div>
  </nav>

</body>
        </html>
